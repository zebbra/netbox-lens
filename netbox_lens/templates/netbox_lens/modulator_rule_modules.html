{% for x in m.add %}<span class="badge text-bg-success me-1" title="add: always set">{{ x }}</span>{% endfor %}{% for x in m.try %}<span class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle me-1" title="try: set if the device returns data">{{ x }}</span>{% endfor %}{% for x in m.block %}<span class="badge text-bg-danger text-decoration-line-through me-1" title="block: never set">{{ x }}</span>{% endfor %}
