{% load i18n %}
<div class="dropdown d-inline-block">
  <button type="button" class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"
          title="{% trans 'LENS bulk actions for the devices matching this filter' %}">
    <i class="mdi mdi-magnify-scan" aria-hidden="true"></i> LENS
  </button>
  <ul class="dropdown-menu">
    <li><a class="dropdown-item" href="{% url 'plugins:netbox_lens:refresh_ips' %}{% if lens_filter_qs %}?{{ lens_filter_qs }}{% endif %}">
      <i class="mdi mdi-ip-network" aria-hidden="true"></i> {% trans "Refresh IPs" %}</a></li>
    <li><a class="dropdown-item" href="{% url 'plugins:netbox_lens:bulk_sync' %}{% if lens_filter_qs %}?{{ lens_filter_qs }}{% endif %}">
      <i class="mdi mdi-sync" aria-hidden="true"></i> {% trans "Sync" %}</a></li>
  </ul>
</div>
